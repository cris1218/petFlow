services:
  postgres:
    image: postgres:16-alpine
    container_name: petflow-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: petflow
      POSTGRES_PASSWORD: petflow
      POSTGRES_DB: petflow
    volumes:
      - petflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petflow -d petflow"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  petflow_pgdata:
